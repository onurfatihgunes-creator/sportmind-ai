name: TEMP provider diagnostic (read-only)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query football-data.org for two fixtures (read-only)
        env:
          FD_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          for id in 542704 564685 542703; do
            echo "--- match $id"
            curl -s -H "X-Auth-Token: $FD_KEY" "https://api.football-data.org/v4/matches/$id" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ['id','status','utcDate','lastUpdated','score','message']}))"
            sleep 7
          done
